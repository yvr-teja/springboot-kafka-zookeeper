spring.application.name=springboot-kafka-zookeeper

#To start the servers
#bin/zookeeper-server-start.sh config/zookeeper.properties
#bin/kafka-server-start.sh config/server.properties

#Consumes and displays all messages from the java-json topic starting from the very beginning.
#bin/kafka-console-consumer.sh --topic java-json --from-beginning --bootstrap-server localhost:9092
#Lists all available topics in the Kafka cluster.
#bin/kafka-topics.sh --list --bootstrap-server localhost:9092
#Displays detailed configuration, partition breakdown, and replica info for the java-json topic.
#bin/kafka-topics.sh --describe --topic java-json --bootstrap-server localhost:9092
spring.kafka.consumer.bootstrap-servers= localhost:9092
spring.kafka.consumer.group-id=myGroup

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
#spring.kafka.consumer.properties.spring.json.trust.packages=*
spring.kafka.consumer.properties.spring.deserializer.value.delegate=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.springbootkafkazookeeper.payload


spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer